<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE RANK Admin</title><script src="/socket.io/socket.io.js"></script><style>
body{margin:0;background:#080a12;color:#f8f8ff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px}.card{background:#101320;border:1px solid #2c3148;border-radius:18px;padding:18px;margin-bottom:16px}h1{margin-top:0}input,button{font:inherit;border-radius:12px;padding:11px 13px;border:1px solid #3b4058;background:#080b14;color:#fff}input{width:100%;margin-top:7px}button{cursor:pointer;background:#33134b}.danger{background:#661a23}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.status{padding:8px 12px;border-radius:99px;display:inline-block;background:#202438}.ok{color:#5cff98}.bad{color:#ff7373}.small{color:#9ba1b6;font-size:13px;margin-top:7px}label{display:block;margin-bottom:11px}.actions{display:flex;gap:9px;flex-wrap:wrap}.log{white-space:pre-wrap;background:#070910;border-radius:12px;padding:12px;min-height:60px;color:#cbd1e8}.timer{font-size:54px;font-weight:900;text-align:center;color:#ffd34d;letter-spacing:2px;margin:8px 0 14px}.timer.running{color:#65ff9b}.timer.finished{color:#ff6666}
</style></head><body><div class="wrap"><h1>👑 LIVE RANK — Painel Admin</h1><div class="card"><h2>🎵 Conexão TikTok</h2><label>Usuário da live<input id="username" value="soubrunocaldas" placeholder="sem @"></label><div class="actions"><button id="connect">Conectar</button><button id="disconnect">Desconectar</button></div><div class="small">Status: <span id="status" class="bad">Desconectado</span></div><div id="msg" class="log" style="margin-top:12px">Pronto.</div></div>
<div class="card"><h2>⏱️ Contagem regressiva</h2><div id="timerDisplay" class="timer">03:00</div><div class="grid"><label>Minutos<input id="timerMinutes" type="number" min="0" max="1440" value="3"></label><label>Segundos<input id="timerSeconds" type="number" min="0" max="59" value="0"></label></div><div class="actions"><button id="timerSet">Definir tempo</button><button id="timerStart">▶ Iniciar</button><button id="timerPause">⏸ Pausar</button><button id="timerReset">↺ Reiniciar</button></div><div class="small">Esse mesmo tempo aparece automaticamente na tela principal.</div></div>
<div class="grid"><div class="card"><h2>👆 Teste TAP</h2><label>Usuário<input id="tapUser" value="teste_tap"></label><label>Quantidade<input id="tapCount" type="number" value="500"></label><button id="testTap">Adicionar TAP</button></div><div class="card"><h2>🎁 Teste Presente</h2><label>Usuário<input id="giftUser" value="teste_presente"></label><label>Nome do presente<input id="giftName" value="Leão"></label><label>Moedas<input id="giftCoins" type="number" value="1000"></label><button id="testGift">Adicionar presente</button></div></div><div class="card"><h2>⚙️ Controles</h2><div class="actions"><button id="pause">⏸ Pausar</button><button id="resetTaps" class="danger">Zerar TAP</button><button id="resetGifts" class="danger">Zerar Presentes</button><button id="resetAll" class="danger">Zerar Tudo</button><button id="openLive">Abrir Tela da Live</button></div></div></div><script>
const socket=io();let paused=false;const $=id=>document.getElementById(id);const formatTime=s=>{s=Math.max(0,Number(s||0));const m=Math.floor(s/60);const sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')};
$('connect').onclick=()=>{ $('msg').textContent='Conectando...';socket.emit('connect-tiktok',$('username').value)};$('disconnect').onclick=()=>socket.emit('disconnect-tiktok');$('testTap').onclick=()=>socket.emit('test-tap',{username:$('tapUser').value,count:$('tapCount').value});$('testGift').onclick=()=>socket.emit('test-gift',{username:$('giftUser').value,giftName:$('giftName').value,coins:$('giftCoins').value});$('pause').onclick=()=>{paused=!paused;socket.emit('pause',paused);$('pause').textContent=paused?'▶ Retomar':'⏸ Pausar'};$('resetTaps').onclick=()=>socket.emit('reset-taps');$('resetGifts').onclick=()=>socket.emit('reset-gifts');$('resetAll').onclick=()=>socket.emit('reset-all');$('openLive').onclick=()=>window.open('/live','_blank');
$('timerSet').onclick=()=>{const sec=Math.max(1,(Number($('timerMinutes').value||0)*60)+Number($('timerSeconds').value||0));socket.emit('timer-set',sec)};$('timerStart').onclick=()=>socket.emit('timer-start');$('timerPause').onclick=()=>socket.emit('timer-pause');$('timerReset').onclick=()=>socket.emit('timer-reset');
socket.on('state',s=>{$('status').textContent=s.connected?'Conectado '+s.username:'Desconectado';$('status').className=s.connected?'ok':'bad';paused=!!s.paused;$('pause').textContent=paused?'▶ Retomar':'⏸ Pausar';const t=s.timer||{};$('timerDisplay').textContent=formatTime(t.remainingSec);$('timerDisplay').className='timer '+(t.remainingSec===0?'finished':t.running?'running':'');if(!t.running&&t.remainingSec===t.durationSec){$('timerMinutes').value=Math.floor((t.durationSec||0)/60);$('timerSeconds').value=(t.durationSec||0)%60}});socket.on('connect-result',r=>{$('msg').textContent=r.ok?'Conectado! Room ID: '+(r.roomId||'—'):'Erro: '+r.error});socket.on('connector-error',e=>$('msg').textContent='Conector: '+e);socket.on('timer-finished',()=>{$('msg').textContent='⏱️ Tempo encerrado!'});
</script></body></html>
