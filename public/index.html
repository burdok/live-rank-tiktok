<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIVE RANK 9:16</title><script src="/socket.io/socket.io.js"></script><style>
html,body{width:100%;height:100%;margin:0}*{box-sizing:border-box}body{background:#050611;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.app{width:100vw;height:100vh;padding:1.4vh 2vw;display:grid;grid-template-rows:18vh minmax(0,1fr);gap:1.1vh;overflow:hidden;background:radial-gradient(circle at 50% 0,#250037 0,#070814 42%,#03040a 100%)}.champ{position:relative;min-height:0;border:1px solid #8e2dc7;border-radius:2.2vh;overflow:hidden;background:linear-gradient(120deg,#15051d,#080913 55%,#1a0710)}.label{position:absolute;z-index:3;left:3vw;top:1.5vh;background:#37134a;padding:.7vh 2.2vw;border-radius:1.4vh;color:#f28dff;font-size:1.45vh;font-weight:900}.runner{position:absolute;top:57%;left:-82vw;transform:translateY(-50%);display:flex;align-items:center;gap:2.4vw;animation:cross 8s linear infinite;white-space:nowrap}.crown{font-size:8vh;filter:drop-shadow(0 0 1.5vh #ffb000);animation:float 1.3s ease-in-out infinite alternate}.hero-avatar{width:8.5vh;height:8.5vh;flex:0 0 8.5vh;border-radius:50%;border:.35vh solid #d946ef;background:#17182a;display:grid;place-items:center;font-size:2.3vh;font-weight:900;overflow:hidden}.hero-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}.hero-info{width:46vw;min-width:0;border:.22vh solid #ff9900;border-radius:2vh;padding:1.2vh 2.5vw;background:rgba(12,8,10,.94);box-shadow:0 0 2vh #ff950055;overflow:hidden}.hero-name{font-size:2.1vh;font-weight:1000;overflow:hidden;text-overflow:ellipsis}.hero-info>div:nth-child(2){font-size:1.3vh;overflow:hidden;text-overflow:ellipsis}.hero-score{font-size:2.7vh;font-weight:1000;color:#ffd000}.cols{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) 27vh;gap:1.1vh 1.8vw;min-height:0;height:100%;overflow:hidden}.panel{min-height:0;height:100%;border:1px solid #6b2e82;border-radius:1.8vh;background:rgba(6,8,18,.94);overflow:hidden;display:flex;flex-direction:column}.panel.tap{grid-column:1;grid-row:1}.panel.gifts{grid-column:2;grid-row:1}.panel.donors{grid-column:1 / 3;grid-row:2}.panel h2{flex:0 0 auto;margin:0;padding:1.15vh 2vw;background:linear-gradient(90deg,#2a0d3f,#15101e);font-size:1.65vh;line-height:1.2;white-space:nowrap}.rows{flex:1;min-height:0;padding:0 1vw .7vh;overflow:hidden}.row{height:10%;min-height:0;display:grid;grid-template-columns:4.5vw 3.8vh minmax(0,1fr) auto;align-items:center;gap:1vw;border-bottom:1px solid #25283b}.row.top1{background:#6c480f55}.pos{font-size:1.45vh;font-weight:900;text-align:center}.avatar{width:3.3vh;height:3.3vh;border-radius:50%;background:#22263a;border:.18vh solid #a63bd3;display:grid;place-items:center;font-size:.9vh;overflow:hidden}.user{font-size:1.25vh;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:1.28vh;font-weight:900;white-space:nowrap}.top3{flex:1;min-height:0;padding:1vh 1.8vw;display:grid;grid-template-columns:1.25fr .8fr .8fr;grid-template-rows:1fr;gap:1.5vw}.winner,.pod{min-height:0;border-radius:1.5vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.winner{border:1px solid #f0a500;background:radial-gradient(circle,#4b260c 0,#130b19 58%,#070810 100%)}.bigCrown{font-size:5.5vh;line-height:1;animation:float .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 1.3vh #ffb000)}.winner .avatar{width:7vh;height:7vh;font-size:1.7vh;border:.35vh solid #d946ef}.winner-name{max-width:95%;font-size:1.55vh;font-weight:1000;margin-top:.5vh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.winner-score{font-size:2vh;font-weight:1000;color:#ffd000}.smallpod{display:contents}.pod{border:1px solid #344585;padding:.8vh 1vw;background:#0c1020}.pod .avatar{width:5.2vh;height:5.2vh;margin:.5vh auto}.pod .winner-name{font-size:1.25vh}.pod .winner-score{font-size:1.5vh}@keyframes cross{0%{left:-82vw;opacity:.2}8%{opacity:1}92%{opacity:1}100%{left:105vw;opacity:.15}}@keyframes float{from{transform:translateY(-.4vh) rotate(-5deg)}to{transform:translateY(.7vh) rotate(5deg)}}
</style></head><body><div class="app"><section class="champ"><div class="label">👑 ÚLTIMO CAMPEÃO</div><div class="runner"><div class="crown">👑</div><div class="hero-avatar" id="heroAvatar">?</div><div class="hero-info"><div class="hero-name" id="heroName">Aguardando campeão...</div><div id="heroGift">Envie presentes para entrar no ranking</div><div class="hero-score" id="heroScore">0 🪙</div></div></div></section><section class="cols"><div class="panel tap"><h2>👆 TOP 10 TAP ⚡</h2><div class="rows" id="tapRows"></div></div><div class="panel gifts"><h2>🎁 TOP 10 PRESENTES</h2><div class="rows" id="giftRows"></div></div><div class="panel donors"><h2>💎 TOP 3 DOADORES</h2><div class="top3"><div class="winner" id="winner"></div><div class="pod" id="second"></div><div class="pod" id="third"></div></div></div></section></div><script>
const socket=io();const fmt=n=>Number(n||0).toLocaleString('pt-BR');const medal=i=>['🥇','🥈','🥉'][i]||(i+1);function av(u){if(u?.avatar)return `<div class="avatar"><img src="${u.avatar}" alt=""></div>`;return `<div class="avatar">${(u?.username||'?').replace('@','').slice(0,2).toUpperCase()}</div>`}function list(el,data,key,suffix=''){document.getElementById(el).innerHTML=(data||[]).map((u,i)=>`<div class="row ${i===0?'top1':''}"><div class="pos">${medal(i)}</div>${av(u)}<div class="user">${u.username}</div><div class="score">${fmt(u[key])}${suffix}</div></div>`).join('')||'<div style="padding:3vh 1vw;text-align:center;color:#74788f;font-size:1.3vh">Aguardando interação...</div>'}function pod(el,u,pos){document.getElementById(el).innerHTML=u?`${pos==='🥇'?'<div class="bigCrown">👑</div>':''}${av(u)}<div class="winner-name">${pos} ${u.username}</div><div class="winner-score">${fmt(u.coins)} 🪙</div>`:`<div style="color:#777;font-size:1.3vh">${pos}<br>Aguardando...</div>`}socket.on('state',s=>{list('tapRows',s.tapRank,'taps',' ⚡');list('giftRows',s.giftRank,'coins',' 🪙');pod('winner',s.top3?.[0],'🥇');pod('second',s.top3?.[1],'🥈');pod('third',s.top3?.[2],'🥉');const c=s.lastChampion||s.top3?.[0];if(c){document.getElementById('heroName').textContent=c.username;document.getElementById('heroScore').textContent=fmt(c.coins)+' 🪙';document.getElementById('heroGift').textContent=c.lastGiftName?'Último presente: '+c.lastGiftName:'Líder de presentes';document.getElementById('heroAvatar').innerHTML=c.avatar?`<img src="${c.avatar}" alt="">`:(c.username||'?').replace('@','').slice(0,2).toUpperCase()}});
</script></body></html>
