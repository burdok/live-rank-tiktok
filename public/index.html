<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIVE RANK 9:16</title><script src="/socket.io/socket.io.js"></script><style>
html,body{width:100%;height:100%;margin:0}*{box-sizing:border-box}body{background:#02030a;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02030a}.app{position:absolute;width:1080px;height:1920px;transform:scale(var(--scale,1));transform-origin:center center;padding:28px 30px;display:grid;grid-template-rows:330px minmax(0,1fr);gap:22px;overflow:hidden;background:radial-gradient(circle at 50% 0,#250037 0,#070814 42%,#03040a 100%)}.champ,.panel{animation:panelIn .35s ease-out both}.champ{position:relative;min-height:0;border:2px solid #8e2dc7;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,#15051d,#080913 55%,#1a0710);box-shadow:0 0 18px #7d25b322}.label{position:absolute;z-index:3;left:34px;top:25px;background:#37134a;padding:13px 24px;border-radius:22px;color:#f28dff;font-size:25px;font-weight:900}.timerBox{position:absolute;z-index:4;right:34px;top:22px;min-width:190px;padding:12px 22px;border:3px solid #ffd34d;border-radius:22px;background:#0b0d18ee;text-align:center;box-shadow:0 0 18px #ffd34d33;transition:border-color .2s ease,box-shadow .2s ease}.timerLabel{font-size:18px;font-weight:900;color:#aeb4c9;letter-spacing:1px}.timerValue{font-size:48px;line-height:1;font-weight:1000;color:#ffd34d;letter-spacing:2px;transition:color .2s ease}.timerBox.running{border-color:#65ff9b;box-shadow:0 0 18px #65ff9b33}.timerBox.running .timerValue{color:#65ff9b}.timerBox.finished{border-color:#ff6666;box-shadow:0 0 22px #ff333344}.timerBox.finished .timerValue{color:#ff6666}.runner{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:92%;display:flex;align-items:center;justify-content:center;gap:26px;white-space:nowrap}.crown{font-size:138px;flex:0 0 auto;filter:drop-shadow(0 0 12px #ffb000);animation:crownFloat 1.8s ease-in-out infinite alternate;will-change:transform}.hero-avatar{width:150px;height:150px;flex:0 0 150px;border-radius:50%;border:6px solid #d946ef;background:#17182a;display:grid;place-items:center;font-size:40px;font-weight:900;overflow:hidden;animation:heroPulse 3s ease-in-out infinite;will-change:transform}.hero-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}.hero-info{width:505px;min-width:0;border:4px solid #ff9900;border-radius:28px;padding:20px 30px;background:rgba(12,8,10,.94);box-shadow:0 0 18px #ff950044;overflow:hidden}.hero-name{font-size:38px;font-weight:1000;overflow:hidden;text-overflow:ellipsis}.hero-info>div:nth-child(2){font-size:23px;overflow:hidden;text-overflow:ellipsis}.hero-score{font-size:50px;font-weight:1000;color:#ffd000}.cols{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:390px minmax(0,1fr);gap:22px;min-height:0;height:100%;overflow:hidden}.panel{min-height:0;height:100%;border:2px solid #6b2e82;border-radius:26px;background:rgba(6,8,18,.94);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 14px #71289912}.panel.donors{grid-column:1 / 3;grid-row:1;animation-delay:.04s}.panel.tap{grid-column:1;grid-row:2;animation-delay:.08s}.panel.gifts{grid-column:2;grid-row:2;animation-delay:.12s}.panel h2{flex:0 0 auto;margin:0;padding:20px 24px;background:linear-gradient(90deg,#2a0d3f,#15101e);font-size:29px;line-height:1.2;white-space:nowrap}.rows{flex:1;min-height:0;padding:0 14px 10px;overflow:hidden}.row{height:10%;min-height:0;display:grid;grid-template-columns:58px 62px minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid #25283b;transition:transform .18s ease,background .18s ease}.row.changed{animation:rowFlash .3s ease-out}.row.top1{background:#6c480f55}.pos{font-size:25px;font-weight:900;text-align:center}.avatar{width:58px;height:58px;border-radius:50%;background:#22263a;border:3px solid #a63bd3;display:grid;place-items:center;font-size:17px;overflow:hidden}.user{font-size:23px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:22px;font-weight:900;white-space:nowrap}.top3{flex:1;min-height:0;padding:14px 24px;display:grid;grid-template-columns:1.2fr .9fr .9fr;gap:20px}.winner,.pod{min-height:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.winner{border:2px solid #f0a500;background:radial-gradient(circle,#4b260c 0,#130b19 58%,#070810 100%);animation:winnerLift 3.2s ease-in-out infinite;will-change:transform}.bigCrown{font-size:72px;line-height:1;animation:crownFloat 1.6s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #ffb000);will-change:transform}.winner .avatar{width:95px;height:95px;font-size:24px;border:5px solid #d946ef}.winner-name{max-width:95%;font-size:24px;font-weight:1000;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.winner-score{font-size:32px;font-weight:1000;color:#ffd000}.pod{border:2px solid #344585;padding:12px;background:#0c1020}.pod .avatar{width:78px;height:78px;margin:6px auto}.pod .winner-name{font-size:21px}.pod .winner-score{font-size:27px}@keyframes panelIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}@keyframes crownFloat{from{transform:translate3d(0,-4px,0) rotate(-4deg)}to{transform:translate3d(0,6px,0) rotate(4deg)}}@keyframes heroPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}@keyframes winnerLift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(0,-3px,0)}}@keyframes rowFlash{0%{transform:scale(1);background:#ffffff00}45%{transform:scale(1.008);background:#7f3cff1a}100%{transform:scale(1);background:#ffffff00}}@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><div class="viewport"><div class="app"><section class="champ"><div class="label">👑 ÚLTIMO CAMPEÃO</div><div id="timerBox" class="timerBox"><div class="timerLabel">TEMPO</div><div id="timerValue" class="timerValue">03:00</div></div><div class="runner"><div class="crown">👑</div><div class="hero-avatar" id="heroAvatar">?</div><div class="hero-info"><div class="hero-name" id="heroName">Aguardando fim da rodada...</div><div id="heroGift">O campeão aparece quando o tempo zerar</div><div class="hero-score" id="heroScore">—</div></div></div></section><section class="cols"><div class="panel donors"><h2>💎 TOP 3 PRESENTEADORES</h2><div class="top3"><div class="winner" id="winner"></div><div class="pod" id="second"></div><div class="pod" id="third"></div></div></div><div class="panel tap"><h2>👆 TOP 10 TAP ⚡</h2><div class="rows" id="tapRows"></div></div><div class="panel gifts"><h2>🎁 TOP 10 PRESENTES</h2><div class="rows" id="giftRows"></div></div></section></div></div><script>
function fit916(){const s=Math.min(window.innerWidth/1080,window.innerHeight/1920);document.documentElement.style.setProperty('--scale',String(s))}window.addEventListener('resize',fit916,{passive:true});fit916();
const socket=io();const fmt=n=>Number(n||0).toLocaleString('pt-BR');const medal=i=>['🥇','🥈','🥉'][i]||(i+1);const formatTime=s=>{s=Math.max(0,Number(s||0));const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')};let lastTapSig='',lastGiftSig='',lastTop3Sig='',lastChampionSig='';function av(u){if(u?.avatar)return `<div class="avatar"><img src="${u.avatar}" alt=""></div>`;return `<div class="avatar">${(u?.username||'?').replace('@','').slice(0,2).toUpperCase()}</div>`}function signature(data,key){return (data||[]).map(u=>`${u.id||u.username}:${u[key]||0}`).join('|')}function list(el,data,key,suffix='',kind=''){const sig=signature(data,key);if(kind==='tap'&&sig===lastTapSig)return;if(kind==='gift'&&sig===lastGiftSig)return;if(kind==='tap')lastTapSig=sig;if(kind==='gift')lastGiftSig=sig;const node=document.getElementById(el);node.innerHTML=(data||[]).map((u,i)=>`<div class="row ${i===0?'top1':''}"><div class="pos">${medal(i)}</div>${av(u)}<div class="user">${u.username}</div><div class="score">${fmt(u[key])}${suffix}</div></div>`).join('')||'<div style="padding:50px 10px;text-align:center;color:#74788f;font-size:23px">Aguardando interação...</div>';requestAnimationFrame(()=>node.querySelectorAll('.row').forEach(r=>{r.classList.add('changed');setTimeout(()=>r.classList.remove('changed'),320)}))}function pod(el,u,pos){document.getElementById(el).innerHTML=u?`${pos==='🥇'?'<div class="bigCrown">👑</div>':''}${av(u)}<div class="winner-name">${pos} ${u.username}</div><div class="winner-score">${fmt(u.coins)} 🪙</div>`:`<div style="color:#777;font-size:23px">${pos}<br>Aguardando...</div>`}function renderTop3(data){const sig=signature(data,'coins');if(sig===lastTop3Sig)return;lastTop3Sig=sig;pod('winner',data?.[0],'🥇');pod('second',data?.[1],'🥈');pod('third',data?.[2],'🥉')}function renderChampion(c){const sig=c?`${c.id||c.username}:${c.coins||0}:${c.at||''}`:'none';if(sig===lastChampionSig)return;lastChampionSig=sig;if(c){document.getElementById('heroName').textContent=c.username;document.getElementById('heroScore').textContent=fmt(c.coins)+' 🪙';document.getElementById('heroGift').textContent='Campeão da rodada anterior';document.getElementById('heroAvatar').innerHTML=c.avatar?`<img src="${c.avatar}" alt="">`:(c.username||'?').replace('@','').slice(0,2).toUpperCase()}else{document.getElementById('heroName').textContent='Aguardando fim da rodada...';document.getElementById('heroGift').textContent='O campeão aparece quando o tempo zerar';document.getElementById('heroScore').textContent='—';document.getElementById('heroAvatar').textContent='?'}}socket.on('state',s=>{list('tapRows',s.tapRank,'taps',' ⚡','tap');list('giftRows',s.giftRank,'coins',' 🪙','gift');renderTop3(s.top3);const t=s.timer||{};const tv=document.getElementById('timerValue');const text=formatTime(t.remainingSec);if(tv.textContent!==text)tv.textContent=text;document.getElementById('timerBox').className='timerBox '+(t.remainingSec===0?'finished':t.running?'running':'');renderChampion(s.lastChampion)});
</script></body></html>
