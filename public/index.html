<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIVE RANK 9:16</title><script src="/socket.io/socket.io.js"></script><style>
html,body{width:100%;height:100%;margin:0}*{box-sizing:border-box}body{background:#02030a;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02030a}.app{position:absolute;width:1080px;height:1920px;transform:scale(var(--scale,1));transform-origin:center center;padding:28px 30px;display:grid;grid-template-rows:300px 250px 300px minmax(0,1fr);gap:18px;overflow:hidden;background:radial-gradient(circle at 50% -5%,#241031 0,#0a0b17 38%,#03040a 100%)}.champ,.panel,.giftArena{animation:panelIn .3s ease-out both}.champ{position:relative;border:2px solid #713194;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,#16091e,#0b0c16 58%,#16090d);box-shadow:0 0 16px #7d25b31c}.sectionTag{position:absolute;left:28px;top:22px;padding:10px 18px;border-radius:18px;background:#2b1538;color:#e89df5;font-size:21px;font-weight:900;letter-spacing:.4px}.timerBox{position:absolute;right:28px;top:20px;min-width:180px;padding:10px 18px;border:2px solid #caa63d;border-radius:20px;background:#090b14e8;text-align:center;transition:border-color .2s ease}.timerLabel{font-size:15px;font-weight:900;color:#9fa6ba;letter-spacing:1px}.timerValue{font-size:45px;line-height:1.05;font-weight:1000;color:#ffd34d;letter-spacing:2px}.timerBox.running{border-color:#4ed98a}.timerBox.running .timerValue{color:#63ef9e}.timerBox.finished{border-color:#ef5e68}.timerBox.finished .timerValue{color:#ff777f}.runner{position:absolute;left:50%;top:59%;transform:translate(-50%,-50%);width:93%;display:grid;grid-template-columns:120px 132px minmax(0,1fr);align-items:center;gap:22px}.crown{font-size:108px;text-align:center;filter:drop-shadow(0 0 8px #ffb00088);animation:crownFloat 1.8s ease-in-out infinite alternate;will-change:transform}.hero-avatar{width:132px;height:132px;border-radius:50%;border:5px solid #b548d7;background:#17182a;display:grid;place-items:center;font-size:36px;font-weight:900;overflow:hidden}.hero-avatar img,.avatar img,.podAvatar img,.giftAvatar img{width:100%;height:100%;object-fit:cover}.hero-info{min-width:0;border-left:4px solid #e99d22;padding:11px 0 11px 24px}.hero-name{font-size:36px;font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hero-sub{font-size:20px;color:#aeb4c8;margin:4px 0}.hero-score{font-size:43px;font-weight:1000;color:#ffd45a}.roundStrip{position:absolute;left:28px;bottom:18px;font-size:16px;color:#8f96aa;font-weight:800}.giftArena{position:relative;border:2px solid #25314c;border-radius:24px;background:linear-gradient(180deg,#0a0d18,#080a12);overflow:hidden}.giftArenaHead{position:absolute;left:20px;top:14px;z-index:5;font-size:16px;color:#8993aa;font-weight:900;letter-spacing:.6px}.giftFeed{position:absolute;inset:44px 16px 14px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px}.giftCard{min-width:0;display:grid;grid-template-columns:68px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border:2px solid #3e4e78;border-radius:18px;background:linear-gradient(135deg,#111827,#0b1020);box-shadow:0 8px 18px #0000002a;animation:giftPop .22s ease-out;overflow:hidden}.giftCard.hot{border-color:#f39c2d;background:linear-gradient(135deg,#2b1606,#12101b)}.giftAvatar{width:64px;height:64px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#202338;border:3px solid #a84ed1;font-size:18px;font-weight:1000}.giftMeta{min-width:0}.giftUser{font-size:17px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.giftName{font-size:13px;color:#9ea8bd;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.giftCoins{font-size:22px;font-weight:1000;color:#ffd45a;margin-top:3px}.comboBadge{align-self:center;text-align:center;font-weight:1000;font-size:20px;line-height:1;color:#fff;text-shadow:0 2px 0 #5b1900;transform:skew(-6deg);white-space:nowrap}.comboBadge span{display:block;font-size:12px;color:#ff9f43;letter-spacing:1px;margin-bottom:3px}.giftCard.bump{animation:giftBump .18s ease-out}.panel{min-height:0;border:2px solid #54256c;border-radius:25px;background:rgba(7,9,18,.96);overflow:hidden;display:flex;flex-direction:column}.panelHead{height:58px;flex:0 0 58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:linear-gradient(90deg,#241132,#11131d)}.panelHead h2{margin:0;font-size:25px}.panelHint{font-size:14px;color:#949bae;font-weight:800}.donors .top3{flex:1;min-height:0;padding:6px 26px 14px;display:grid;grid-template-columns:1fr 1.18fr 1fr;align-items:end;gap:18px}.podiumSlot{position:relative;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center}.podiumSlot.first{transform:translateY(-5px)}.podAvatar{width:76px;height:76px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#202338;border:4px solid #61698e;font-size:20px;font-weight:1000}.podiumSlot.first .podAvatar{width:96px;height:96px;border:5px solid #d39a2c}.podiumSlot.second .podAvatar{border-color:#aab3c7}.podiumSlot.third .podAvatar{border-color:#b77945}.podMedal{font-size:30px;line-height:1;margin:4px 0 2px}.podiumSlot.first .podMedal{font-size:38px}.podName{width:100%;font-size:18px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.podiumSlot.first .podName{font-size:21px}.podScore{font-size:22px;font-weight:1000;color:#f2c853;margin-top:2px}.podiumSlot.first .podScore{font-size:27px}.podBase{width:100%;margin-top:7px;border-radius:14px 14px 7px 7px;background:linear-gradient(180deg,#171b2a,#0e111c);border:1px solid #303850;padding:6px;font-size:14px;font-weight:900;color:#8f97ae}.podiumSlot.first .podBase{padding:9px 6px 8px;background:linear-gradient(180deg,#30200b,#15121a);border-color:#7d5b22;color:#d8b866}.rankArea{display:grid;grid-template-columns:1fr 1fr;gap:18px;min-height:0}.rows{flex:1;min-height:0;padding:0 12px 10px;overflow:hidden}.row{height:10%;min-height:0;display:grid;grid-template-columns:48px 54px minmax(0,1fr) auto;align-items:center;gap:10px;border-bottom:1px solid #202436;transition:transform .16s ease,background .16s ease}.row.changed{animation:rowFlash .28s ease-out}.row.top1{background:#9b6a1428;border-radius:12px}.pos{font-size:22px;font-weight:1000;text-align:center}.avatar{width:50px;height:50px;border-radius:50%;background:#202338;border:2px solid #8740a2;display:grid;place-items:center;font-size:15px;overflow:hidden}.user{font-size:21px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:20px;font-weight:1000;white-space:nowrap}.empty{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;color:#71788d;font-size:22px;padding:30px}@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes crownFloat{from{transform:translate3d(0,-3px,0) rotate(-3deg)}to{transform:translate3d(0,5px,0) rotate(3deg)}}@keyframes rowFlash{0%{transform:scale(1)}45%{transform:scale(1.006);background:#7234b51b}100%{transform:scale(1)}}@keyframes giftPop{from{opacity:0;transform:scale(.86) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}@keyframes giftBump{0%{transform:scale(1)}50%{transform:scale(1.045)}100%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style></head><body><div class="viewport"><div class="app"><section class="champ"><div class="sectionTag">👑 ÚLTIMO CAMPEÃO</div><div id="timerBox" class="timerBox"><div class="timerLabel">RODADA</div><div id="timerValue" class="timerValue">03:00</div></div><div class="runner"><div class="crown">👑</div><div class="hero-avatar" id="heroAvatar">?</div><div class="hero-info"><div class="hero-name" id="heroName">Aguardando fim da rodada...</div><div id="heroGift" class="hero-sub">O campeão aparece quando o tempo zerar</div><div class="hero-score" id="heroScore">—</div></div></div><div id="roundStrip" class="roundStrip">Rodada aguardando início</div></section><section class="giftArena"><div class="giftArenaHead">⚡ PRESENTES AO VIVO</div><div id="giftFeed" class="giftFeed"></div></section><section class="panel donors"><div class="panelHead"><h2>💎 TOP 3 PRESENTEADORES</h2><span class="panelHint">ACUMULADO</span></div><div class="top3"><div id="second" class="podiumSlot second"></div><div id="winner" class="podiumSlot first"></div><div id="third" class="podiumSlot third"></div></div></section><section class="rankArea"><div class="panel"><div class="panelHead"><h2>👆 TOP 10 TAP</h2><span class="panelHint">RODADA</span></div><div class="rows" id="tapRows"></div></div><div class="panel"><div class="panelHead"><h2>🎁 TOP 10 PRESENTES</h2><span class="panelHint">RODADA</span></div><div class="rows" id="giftRows"></div></div></section></div></div><script>
function fit916(){const s=Math.min(window.innerWidth/1080,window.innerHeight/1920);document.documentElement.style.setProperty('--scale',String(s))}window.addEventListener('resize',fit916,{passive:true});fit916();const socket=io();const fmt=n=>Number(n||0).toLocaleString('pt-BR');const medal=i=>['🥇','🥈','🥉'][i]||(i+1);const formatTime=s=>{s=Math.max(0,Number(s||0));const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')};let lastTapSig='',lastGiftSig='',lastTop3Sig='',lastChampionSig='';const giftCards=new Map();const feed=document.getElementById('giftFeed');function avatar(u,cls='avatar'){if(u?.avatar)return `<div class="${cls}"><img src="${u.avatar}" alt=""></div>`;return `<div class="${cls}">${(u?.username||'?').replace('@','').slice(0,2).toUpperCase()}</div>`}function signature(data,key){return(data||[]).map(u=>`${u.id||u.username}:${u[key]||0}`).join('|')}function list(el,data,key,suffix='',kind=''){const sig=signature(data,key);if(kind==='tap'&&sig===lastTapSig)return;if(kind==='gift'&&sig===lastGiftSig)return;if(kind==='tap')lastTapSig=sig;if(kind==='gift')lastGiftSig=sig;const node=document.getElementById(el);node.innerHTML=(data||[]).map((u,i)=>`<div class="row ${i===0?'top1':''}"><div class="pos">${medal(i)}</div>${avatar(u)}<div class="user">${u.username}</div><div class="score">${fmt(u[key])}${suffix}</div></div>`).join('')||'<div class="empty">Aguardando interação...</div>';requestAnimationFrame(()=>node.querySelectorAll('.row').forEach(r=>{r.classList.add('changed');setTimeout(()=>r.classList.remove('changed'),300)}))}function donor(el,u,pos,label){document.getElementById(el).innerHTML=u?`${avatar(u,'podAvatar')}<div class="podMedal">${pos}</div><div class="podName">${u.username}</div><div class="podScore">${fmt(u.coins)} 🪙</div><div class="podBase">${label}</div>`:`<div class="empty">${label}<br>Aguardando...</div>`}function renderTop3(data){const sig=signature(data,'coins');if(sig===lastTop3Sig)return;lastTop3Sig=sig;donor('winner',data?.[0],'🥇','1º LUGAR');donor('second',data?.[1],'🥈','2º LUGAR');donor('third',data?.[2],'🥉','3º LUGAR')}function renderChampion(c){const sig=c?`${c.id||c.username}:${c.coins||0}:${c.at||''}`:'none';if(sig===lastChampionSig)return;lastChampionSig=sig;if(c){document.getElementById('heroName').textContent=c.username;document.getElementById('heroScore').textContent=fmt(c.coins)+' 🪙';document.getElementById('heroGift').textContent='Campeão de presentes da rodada anterior';document.getElementById('heroAvatar').innerHTML=c.avatar?`<img src="${c.avatar}" alt="">`:(c.username||'?').replace('@','').slice(0,2).toUpperCase()}else{document.getElementById('heroName').textContent='Aguardando fim da rodada...';document.getElementById('heroGift').textContent='O campeão aparece quando o tempo zerar';document.getElementById('heroScore').textContent='—';document.getElementById('heroAvatar').textContent='?'}}function giftKey(e){return `${e.id||e.username}:${e.giftId}`}function renderGiftFeed(e){const key=giftKey(e);let rec=giftCards.get(key);if(!rec){if(giftCards.size>=6){const oldest=[...giftCards.entries()].sort((a,b)=>a[1].last-b[1].last)[0];if(oldest){clearTimeout(oldest[1].timer);oldest[1].el.remove();giftCards.delete(oldest[0])}}const el=document.createElement('div');el.className='giftCard';feed.appendChild(el);rec={el,timer:null,last:0};giftCards.set(key,rec)}rec.last=Date.now();rec.el.classList.toggle('hot',Number(e.combo)>=5||Number(e.comboCoins)>=500);rec.el.innerHTML=`${avatar(e,'giftAvatar')}<div class="giftMeta"><div class="giftUser">${e.username}</div><div class="giftName">${e.name}</div><div class="giftCoins">+${fmt(e.comboCoins)} 🪙</div></div><div class="comboBadge"><span>COMBO</span>x${fmt(e.combo||1)}</div>`;rec.el.classList.remove('bump');void rec.el.offsetWidth;rec.el.classList.add('bump');clearTimeout(rec.timer);rec.timer=setTimeout(()=>{rec.el.remove();giftCards.delete(key)},2600)}socket.on('gift-feed-event',renderGiftFeed);socket.on('state',s=>{list('tapRows',s.tapRank,'taps',' ⚡','tap');list('giftRows',s.giftRank,'coins',' 🪙','gift');renderTop3(s.top3);const t=s.timer||{};const text=formatTime(t.remainingSec);const tv=document.getElementById('timerValue');if(tv.textContent!==text)tv.textContent=text;document.getElementById('timerBox').className='timerBox '+(t.remainingSec===0?'finished':t.running?'running':'');document.getElementById('roundStrip').textContent=t.running?'Rodada em andamento':t.remainingSec===0?'Rodada encerrada':'Rodada aguardando início';renderChampion(s.lastChampion)});
</script></body></html>
