<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE RANK</title><script src="/socket.io/socket.io.js"></script><style>
html,body{width:100%;height:100%;margin:0}*{box-sizing:border-box}body{background:#050611;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.app{width:100vw;height:100vh;min-width:100vw;min-height:100vh;padding:18px;display:grid;grid-template-rows:220px minmax(0,1fr);gap:16px;overflow:hidden;background:radial-gradient(circle at 50% 0,#250037 0,#070814 42%,#03040a 100%)}.champ{position:relative;min-height:0;border:1px solid #8e2dc7;border-radius:22px;overflow:hidden;background:linear-gradient(120deg,#15051d,#080913 55%,#1a0710)}.label{position:absolute;left:25px;top:18px;background:#37134a;padding:8px 15px;border-radius:15px;color:#f28dff;font-weight:800}.runner{position:absolute;top:54%;left:-420px;transform:translateY(-50%);display:flex;align-items:center;gap:20px;animation:cross 8s linear infinite}.crown{font-size:120px;filter:drop-shadow(0 0 22px #ffb000);animation:float 1.3s ease-in-out infinite alternate}.hero-avatar{width:120px;height:120px;border-radius:50%;border:4px solid #d946ef;background:#17182a;display:grid;place-items:center;font-size:36px;font-weight:900;overflow:hidden}.hero-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}.hero-info{min-width:330px;border:2px solid #ff9900;border-radius:25px;padding:18px 28px;background:rgba(12,8,10,.94);box-shadow:0 0 24px #ff950055}.hero-name{font-size:32px;font-weight:900}.hero-score{font-size:46px;font-weight:1000;color:#ffd000}.cols{display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:16px;min-height:0;height:100%;overflow:hidden}.panel{min-height:0;height:100%;border:1px solid #6b2e82;border-radius:20px;background:rgba(6,8,18,.94);overflow:hidden;display:flex;flex-direction:column}.panel h2{flex:0 0 auto;margin:0;padding:18px 20px;background:linear-gradient(90deg,#2a0d3f,#15101e);font-size:23px}.rows{flex:1;min-height:0;padding:0 12px 12px;overflow:hidden}.row{height:calc((100% - 12px)/10);min-height:42px;display:grid;grid-template-columns:42px 48px 1fr auto;align-items:center;gap:9px;border-bottom:1px solid #25283b}.row.top1{background:#6c480f55}.pos{font-size:20px;font-weight:900;text-align:center}.avatar{width:42px;height:42px;border-radius:50%;background:#22263a;border:2px solid #a63bd3;display:grid;place-items:center;font-size:13px;overflow:hidden}.user{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:20px;font-weight:900}.top3{flex:1;min-height:0;padding:16px;display:grid;grid-template-rows:minmax(0,1fr) auto}.winner{min-height:0;border:1px solid #f0a500;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle,#4b260c 0,#130b19 58%,#070810 100%)}.bigCrown{font-size:clamp(56px,6vh,92px);animation:float .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #ffb000)}.winner .avatar{width:clamp(72px,9vh,120px);height:clamp(72px,9vh,120px);font-size:28px;border:4px solid #d946ef}.winner-name{font-size:clamp(18px,2.2vh,25px);font-weight:1000;margin-top:10px}.winner-score{font-size:clamp(25px,3.5vh,39px);font-weight:1000;color:#ffd000}.smallpod{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.pod{border:1px solid #344585;border-radius:16px;text-align:center;padding:13px;background:#0c1020}.pod .avatar{margin:auto}.pod .score{font-size:18px;margin-top:5px}@keyframes cross{0%{left:-430px;opacity:.2}8%{opacity:1}92%{opacity:1}100%{left:calc(100% + 30px);opacity:.15}}@keyframes float{from{transform:translateY(-4px) rotate(-5deg)}to{transform:translateY(7px) rotate(5deg)}}@media(max-width:1000px){.app{padding:10px;gap:10px;grid-template-rows:18vh minmax(0,1fr)}.cols{grid-template-columns:1fr 1fr 1.05fr;gap:8px}.panel h2{padding:10px;font-size:clamp(12px,2vw,18px)}.row{grid-template-columns:30px 34px minmax(0,1fr) auto;gap:4px}.avatar{width:30px;height:30px}.pos,.score{font-size:clamp(11px,1.5vw,16px)}.user{font-size:clamp(10px,1.4vw,15px)}.runner{animation:cross 8s linear infinite}.crown{font-size:70px}.hero-avatar{width:70px;height:70px}.hero-info{min-width:220px;padding:10px 14px}.hero-name{font-size:20px}.hero-score{font-size:28px}.top3{padding:8px}.pod{padding:7px}.smallpod{gap:6px;margin-top:6px}}
</style></head><body><div class="app"><section class="champ"><div class="label">👑 ÚLTIMO CAMPEÃO</div><div class="runner"><div class="crown">👑</div><div class="hero-avatar" id="heroAvatar">?</div><div class="hero-info"><div class="hero-name" id="heroName">Aguardando campeão...</div><div id="heroGift">Envie presentes para entrar no ranking</div><div class="hero-score" id="heroScore">0 🪙</div></div></div></section><section class="cols"><div class="panel"><h2>👆 TOP 10 TAP ⚡</h2><div class="rows" id="tapRows"></div></div><div class="panel"><h2>🎁 TOP 10 PRESENTES</h2><div class="rows" id="giftRows"></div></div><div class="panel"><h2>💎 TOP 3 DOADORES</h2><div class="top3"><div class="winner" id="winner"></div><div class="smallpod"><div class="pod" id="second"></div><div class="pod" id="third"></div></div></div></div></section></div><script>
const socket=io();const fmt=n=>Number(n||0).toLocaleString('pt-BR');const medal=i=>['🥇','🥈','🥉'][i]||(i+1);function av(u){if(u?.avatar)return `<div class="avatar"><img src="${u.avatar}" alt=""></div>`;return `<div class="avatar">${(u?.username||'?').replace('@','').slice(0,2).toUpperCase()}</div>`}function list(el,data,key,suffix=''){document.getElementById(el).innerHTML=(data||[]).map((u,i)=>`<div class="row ${i===0?'top1':''}"><div class="pos">${medal(i)}</div>${av(u)}<div class="user">${u.username}</div><div class="score">${fmt(u[key])}${suffix}</div></div>`).join('')||'<div style="padding:30px;text-align:center;color:#74788f">Aguardando interação...</div>'}function pod(el,u,pos){document.getElementById(el).innerHTML=u?`${pos==='🥇'?'<div class="bigCrown">👑</div>':''}${av(u)}<div class="winner-name">${pos} ${u.username}</div><div class="winner-score">${fmt(u.coins)} 🪙</div>`:`<div style="padding:40px 0;color:#777">${pos}<br>Aguardando...</div>`}socket.on('state',s=>{list('tapRows',s.tapRank,'taps',' ⚡');list('giftRows',s.giftRank,'coins',' 🪙');pod('winner',s.top3?.[0],'🥇');pod('second',s.top3?.[1],'🥈');pod('third',s.top3?.[2],'🥉');const c=s.lastChampion||s.top3?.[0];if(c){document.getElementById('heroName').textContent=c.username;document.getElementById('heroScore').textContent=fmt(c.coins)+' 🪙';document.getElementById('heroGift').textContent=c.lastGiftName?'Último presente: '+c.lastGiftName:'Líder de presentes';document.getElementById('heroAvatar').innerHTML=c.avatar?`<img src="${c.avatar}" alt="">`:(c.username||'?').replace('@','').slice(0,2).toUpperCase()}});
</script></body></html>
