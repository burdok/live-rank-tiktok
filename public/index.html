<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIVE RANK 9:16</title><script src="/socket.io/socket.io.js"></script><style>
html,body{width:100%;height:100%;margin:0}*{box-sizing:border-box}body{background:#02030a;color:#fff;font-family:Inter,Arial,sans-serif;overflow:hidden}.viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#02030a}.app{position:absolute;width:1080px;height:1920px;transform:scale(var(--scale,1));transform-origin:center center;padding:28px 30px;display:grid;grid-template-rows:330px minmax(0,1fr);gap:22px;overflow:hidden;background:radial-gradient(circle at 50% 0,#250037 0,#070814 42%,#03040a 100%)}.champ{position:relative;min-height:0;border:2px solid #8e2dc7;border-radius:28px;overflow:hidden;background:linear-gradient(120deg,#15051d,#080913 55%,#1a0710)}.label{position:absolute;z-index:3;left:34px;top:25px;background:#37134a;padding:13px 24px;border-radius:22px;color:#f28dff;font-size:25px;font-weight:900}.timerBox{position:absolute;z-index:4;right:34px;top:22px;min-width:190px;padding:12px 22px;border:3px solid #ffd34d;border-radius:22px;background:#0b0d18ee;text-align:center;box-shadow:0 0 24px #ffd34d44}.timerLabel{font-size:18px;font-weight:900;color:#aeb4c9;letter-spacing:1px}.timerValue{font-size:48px;line-height:1;font-weight:1000;color:#ffd34d;letter-spacing:2px}.timerBox.running{border-color:#65ff9b;box-shadow:0 0 28px #65ff9b55}.timerBox.running .timerValue{color:#65ff9b}.timerBox.finished{border-color:#ff6666;box-shadow:0 0 32px #ff333377;animation:timerPulse .7s ease-in-out infinite alternate}.timerBox.finished .timerValue{color:#ff6666}.runner{position:absolute;left:50%;top:60%;transform:translate(-50%,-50%);width:92%;display:flex;align-items:center;justify-content:center;gap:26px;white-space:nowrap}.crown{font-size:138px;flex:0 0 auto;filter:drop-shadow(0 0 22px #ffb000);animation:float 1.3s ease-in-out infinite alternate}.hero-avatar{width:150px;height:150px;flex:0 0 150px;border-radius:50%;border:6px solid #d946ef;background:#17182a;display:grid;place-items:center;font-size:40px;font-weight:900;overflow:hidden;animation:champPulse 2s ease-in-out infinite}.hero-avatar img,.avatar img{width:100%;height:100%;object-fit:cover}.hero-info{width:505px;min-width:0;border:4px solid #ff9900;border-radius:28px;padding:20px 30px;background:rgba(12,8,10,.94);box-shadow:0 0 28px #ff950055;overflow:hidden;animation:glow 2.2s ease-in-out infinite alternate}.hero-name{font-size:38px;font-weight:1000;overflow:hidden;text-overflow:ellipsis}.hero-info>div:nth-child(2){font-size:23px;overflow:hidden;text-overflow:ellipsis}.hero-score{font-size:50px;font-weight:1000;color:#ffd000}.cols{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) 470px;gap:22px;min-height:0;height:100%;overflow:hidden}.panel{min-height:0;height:100%;border:2px solid #6b2e82;border-radius:26px;background:rgba(6,8,18,.94);overflow:hidden;display:flex;flex-direction:column}.panel.tap{grid-column:1;grid-row:1}.panel.gifts{grid-column:2;grid-row:1}.panel.donors{grid-column:1 / 3;grid-row:2}.panel h2{flex:0 0 auto;margin:0;padding:20px 24px;background:linear-gradient(90deg,#2a0d3f,#15101e);font-size:29px;line-height:1.2;white-space:nowrap}.rows{flex:1;min-height:0;padding:0 14px 10px;overflow:hidden}.row{height:10%;min-height:0;display:grid;grid-template-columns:58px 62px minmax(0,1fr) auto;align-items:center;gap:12px;border-bottom:1px solid #25283b}.row.top1{background:#6c480f55}.pos{font-size:25px;font-weight:900;text-align:center}.avatar{width:58px;height:58px;border-radius:50%;background:#22263a;border:3px solid #a63bd3;display:grid;place-items:center;font-size:17px;overflow:hidden}.user{font-size:23px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score{font-size:22px;font-weight:900;white-space:nowrap}.top3{flex:1;min-height:0;padding:18px 24px;display:grid;grid-template-columns:1.25fr .8fr .8fr;gap:20px}.winner,.pod{min-height:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}.winner{border:2px solid #f0a500;background:radial-gradient(circle,#4b260c 0,#130b19 58%,#070810 100%)}.bigCrown{font-size:95px;line-height:1;animation:float .9s ease-in-out infinite alternate;filter:drop-shadow(0 0 18px #ffb000)}.winner .avatar{width:122px;height:122px;font-size:28px;border:5px solid #d946ef}.winner-name{max-width:95%;font-size:27px;font-weight:1000;margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.winner-score{font-size:37px;font-weight:1000;color:#ffd000}.pod{border:2px solid #344585;padding:14px;background:#0c1020}.pod .avatar{width:94px;height:94px;margin:8px auto}.pod .winner-name{font-size:23px}.pod .winner-score{font-size:28px}@keyframes float{from{transform:translateY(-7px) rotate(-7deg) scale(1)}to{transform:translateY(11px) rotate(7deg) scale(1.08)}}@keyframes champPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}@keyframes glow{from{box-shadow:0 0 14px #ff950044}to{box-shadow:0 0 34px #ff950088}}@keyframes timerPulse{from{transform:scale(1)}to{transform:scale(1.05)}}
</style></head><body><div class="viewport"><div class="app"><section class="champ"><div class="label">👑 ÚLTIMO CAMPEÃO</div><div id="timerBox" class="timerBox"><div class="timerLabel">TEMPO</div><div id="timerValue" class="timerValue">03:00</div></div><div class="runner"><div class="crown">👑</div><div class="hero-avatar" id="heroAvatar">?</div><div class="hero-info"><div class="hero-name" id="heroName">Aguardando campeão...</div><div id="heroGift">Envie presentes para entrar no ranking</div><div class="hero-score" id="heroScore">0 🪙</div></div></div></section><section class="cols"><div class="panel tap"><h2>👆 TOP 10 TAP ⚡</h2><div class="rows" id="tapRows"></div></div><div class="panel gifts"><h2>🎁 TOP 10 PRESENTES</h2><div class="rows" id="giftRows"></div></div><div class="panel donors"><h2>💎 TOP 3 DOADORES</h2><div class="top3"><div class="winner" id="winner"></div><div class="pod" id="second"></div><div class="pod" id="third"></div></div></div></section></div></div><script>
function fit916(){const s=Math.min(window.innerWidth/1080,window.innerHeight/1920);document.documentElement.style.setProperty('--scale',String(s))}window.addEventListener('resize',fit916);fit916();
const socket=io();const fmt=n=>Number(n||0).toLocaleString('pt-BR');const medal=i=>['🥇','🥈','🥉'][i]||(i+1);const formatTime=s=>{s=Math.max(0,Number(s||0));const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0')};function av(u){if(u?.avatar)return `<div class="avatar"><img src="${u.avatar}" alt=""></div>`;return `<div class="avatar">${(u?.username||'?').replace('@','').slice(0,2).toUpperCase()}</div>`}function list(el,data,key,suffix=''){document.getElementById(el).innerHTML=(data||[]).map((u,i)=>`<div class="row ${i===0?'top1':''}"><div class="pos">${medal(i)}</div>${av(u)}<div class="user">${u.username}</div><div class="score">${fmt(u[key])}${suffix}</div></div>`).join('')||'<div style="padding:50px 10px;text-align:center;color:#74788f;font-size:23px">Aguardando interação...</div>'}function pod(el,u,pos){document.getElementById(el).innerHTML=u?`${pos==='🥇'?'<div class="bigCrown">👑</div>':''}${av(u)}<div class="winner-name">${pos} ${u.username}</div><div class="winner-score">${fmt(u.coins)} 🪙</div>`:`<div style="color:#777;font-size:23px">${pos}<br>Aguardando...</div>`}socket.on('state',s=>{list('tapRows',s.tapRank,'taps',' ⚡');list('giftRows',s.giftRank,'coins',' 🪙');pod('winner',s.top3?.[0],'🥇');pod('second',s.top3?.[1],'🥈');pod('third',s.top3?.[2],'🥉');const t=s.timer||{};document.getElementById('timerValue').textContent=formatTime(t.remainingSec);document.getElementById('timerBox').className='timerBox '+(t.remainingSec===0?'finished':t.running?'running':'');const c=s.lastChampion||s.top3?.[0];if(c){document.getElementById('heroName').textContent=c.username;document.getElementById('heroScore').textContent=fmt(c.coins)+' 🪙';document.getElementById('heroGift').textContent=c.lastGiftName?'Último presente: '+c.lastGiftName:'Líder de presentes';document.getElementById('heroAvatar').innerHTML=c.avatar?`<img src="${c.avatar}" alt="">`:(c.username||'?').replace('@','').slice(0,2).toUpperCase()}});
</script></body></html>
